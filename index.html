<!--
ionicinit.min.js 的功能與說明：
push(name, title)：切換到目標頁，並回傳 Promise；約 100ms 後才 resolve，所以你可安全接 .then(...) 做「切頁後渲染」。
presentAlert(header=null, message=null, buttons=null)：快速顯示 Ionic Alert；流程是建立元件 → 設定內容/按鈕 → 顯示 → 移除，避免殘留 DOM。
presentActionSheet(header=null, subHeader=null, buttons=null)：給使用者一組操作選單（例如編輯/刪除/取消）；同樣會在關閉後清理元件。
presentToast(message=null, duration=1800, position='bottom', color=null)：短暫提示訊息（成功、錯誤、已儲存等），支援時間、位置、顏色與按鈕。
window.load 初始化段：動態載入 Ionic CDN 資源、建立 ion-app/ion-router/ion-nav、自動把所有 page-* 註冊成 route，最後呼叫 setUpIonic 完成啟動。

ionicinit.min.js 的使用方式：
1. 在 HTML 中使用 page-* 標籤定義頁面結構。
2. 在 JavaScript 中使用 push('page-xxx') 切換頁面。
3. 使用 presentAlert(...)、presentActionSheet(...)、presentToast(...) 顯示提示框。
-->
<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="港幣記賬" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>港幣記賬</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="shortcut icon apple-touch-icon" href="appicon.png" />
    <script src="ionicinit.min.js"></script>
    <style>
      :root {
        --ion-color-primary: #3880ff;
      }
      .hero {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .hero h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      .hero p {
        margin: 0;
        color: var(--ion-color-medium);
        line-height: 1.5;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .stat-card {
        background: var(--ion-color-light);
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
      }
      .stat-card .label {
        font-size: 0.85rem;
        color: var(--ion-color-medium);
        margin-bottom: 0.25rem;
      }
      .stat-card .value {
        font-size: 1.35rem;
        font-weight: 700;
        color: var(--ion-color-primary);
      }
      .stat-card .value.expense {
        color: var(--ion-color-danger);
      }
      .nav-buttons ion-button {
        margin-bottom: 0.75rem;
      }
      .preview-amount {
        text-align: center;
        margin: 1rem 0 1.5rem;
        padding: 1rem;
        background: var(--ion-color-light);
        border-radius: 12px;
      }
      .preview-amount .label {
        font-size: 0.9rem;
        color: var(--ion-color-medium);
      }
      .preview-amount .value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--ion-color-danger);
      }
      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--ion-color-medium);
      }
      .empty-state ion-icon {
        font-size: 4rem;
        margin-bottom: 0.75rem;
      }
      .record-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 0.5rem;
        font-size: 0.85rem;
        color: var(--ion-color-medium);
      }
      .record-amount {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--ion-color-danger);
      }
    </style>
  </head>

  <body>

    <page-home>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>港幣記賬</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div class="hero">
          <h1>港幣記賬</h1>
          <p>輕鬆記錄日常支出，以港幣（HK$）結算，資料儲存在本機。</p>
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="label">紀錄總數</div>
            <div class="value" id="home-total-count">0</div>
          </div>
          <div class="stat-card">
            <div class="label">最新支出</div>
            <div class="value expense" id="home-latest-amount">HK$0.00</div>
          </div>
        </div>
        <div class="nav-buttons">
          <ion-button expand="block" shape="round" onclick="push('page-expense').then(function(){ initExpensePage(); });">
            <ion-icon slot="start" name="add-circle-outline"></ion-icon>
            記一筆支出
          </ion-button>
          <ion-button expand="block" shape="round" fill="outline" onclick="push('page-records').then(function(){ renderRecords(); });">
            <ion-icon slot="start" name="list-outline"></ion-icon>
            查看紀錄
          </ion-button>
        </div>
      </ion-content>
    </page-home>

    <page-expense>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-buttons slot="start">
            <ion-back-button defaultHref="/"></ion-back-button>
          </ion-buttons>
          <ion-title>記賬</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div class="preview-amount">
          <div class="label">支出金額</div>
          <div class="value" id="expense-preview">HK$0.00</div>
        </div>
        <ion-list lines="full">
          <ion-item>
            <ion-label position="stacked">支出項目</ion-label>
            <ion-input id="expense-item" type="text" placeholder="例如：午餐、交通"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">金額（HK$）</ion-label>
            <ion-input id="expense-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="stacked">日期</ion-label>
            <ion-input id="expense-date" type="date"></ion-input>
          </ion-item>
        </ion-list>
        <ion-button expand="block" shape="round" class="ion-margin-top" onclick="saveExpense();">
          儲存紀錄
        </ion-button>
      </ion-content>
    </page-expense>

    <page-records>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-buttons slot="start">
            <ion-back-button defaultHref="/"></ion-back-button>
          </ion-buttons>
          <ion-title>支出紀錄</ion-title>
          <ion-buttons slot="end">
            <ion-button id="btn-clear-all" fill="clear" onclick="confirmClearAll();">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div id="records-empty" class="empty-state" hidden>
          <ion-icon name="wallet-outline"></ion-icon>
          <p>尚無支出紀錄</p>
          <p>前往記賬頁新增第一筆吧</p>
        </div>
        <div id="records-list"></div>
      </ion-content>
    </page-records>

    <script>
      var STORAGE_KEY = "hk-expense-records";

      function getRecords() {
        try {
          var data = localStorage.getItem(STORAGE_KEY);
          return data ? JSON.parse(data) : [];
        } catch (e) {
          return [];
        }
      }

      function setRecords(records) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      }

      function formatHKD(amount) {
        var n = parseFloat(amount);
        if (isNaN(n)) return "HK$0.00";
        return "HK$" + n.toFixed(2);
      }

      function todayISO() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }

      function sortRecords(records) {
        return records.slice().sort(function (a, b) {
          if (a.date !== b.date) return b.date.localeCompare(a.date);
          return (b.id || 0) - (a.id || 0);
        });
      }

      function updateHomeStats() {
        var records = getRecords();
        var totalEl = document.getElementById("home-total-count");
        var latestEl = document.getElementById("home-latest-amount");
        if (!totalEl || !latestEl) return;
        totalEl.textContent = String(records.length);
        if (records.length === 0) {
          latestEl.textContent = "HK$0.00";
          return;
        }
        var latest = sortRecords(records)[0];
        latestEl.textContent = formatHKD(latest.amount);
      }

      function initExpensePage() {
        var dateInput = document.getElementById("expense-date");
        var amountInput = document.getElementById("expense-amount");
        var itemInput = document.getElementById("expense-item");
        if (dateInput && !dateInput.value) dateInput.value = todayISO();
        if (itemInput) itemInput.value = "";
        if (amountInput) amountInput.value = "";
        updateExpensePreview();
        if (amountInput && !amountInput._bound) {
          amountInput._bound = true;
          amountInput.addEventListener("ionInput", updateExpensePreview);
          amountInput.addEventListener("input", updateExpensePreview);
        }
      }

      function updateExpensePreview() {
        var amountInput = document.getElementById("expense-amount");
        var preview = document.getElementById("expense-preview");
        if (!preview) return;
        var val = amountInput ? parseFloat(amountInput.value) : 0;
        preview.textContent = formatHKD(isNaN(val) ? 0 : val);
      }

      function validateExpense(item, amount, date) {
        if (!item || !item.trim()) {
          presentAlert("輸入錯誤", "請填寫支出項目。");
          return false;
        }
        if (isNaN(amount) || amount <= 0) {
          presentAlert("輸入錯誤", "請輸入大於 0 的金額。");
          return false;
        }
        if (!date) {
          presentAlert("輸入錯誤", "請選擇日期。");
          return false;
        }
        return true;
      }

      function saveExpense() {
        var itemInput = document.getElementById("expense-item");
        var amountInput = document.getElementById("expense-amount");
        var dateInput = document.getElementById("expense-date");
        var item = itemInput ? itemInput.value.trim() : "";
        var amount = parseFloat(amountInput ? amountInput.value : "");
        var date = dateInput ? dateInput.value : "";
        if (!validateExpense(item, amount, date)) return;

        var records = getRecords();
        records.push({
          id: Date.now(),
          item: item,
          amount: Math.round(amount * 100) / 100,
          date: date
        });
        setRecords(records);
        presentToast("已儲存：" + item + " " + formatHKD(amount), 2000, "bottom", "success");
        push("page-home").then(function () {
          updateHomeStats();
        });
      }

      function renderRecords() {
        var listEl = document.getElementById("records-list");
        var emptyEl = document.getElementById("records-empty");
        var clearBtn = document.getElementById("btn-clear-all");
        if (!listEl || !emptyEl) return;

        var records = sortRecords(getRecords());
        listEl.innerHTML = "";

        if (records.length === 0) {
          emptyEl.hidden = false;
          if (clearBtn) clearBtn.disabled = true;
          return;
        }

        emptyEl.hidden = true;
        if (clearBtn) clearBtn.disabled = false;

        records.forEach(function (r) {
          var card = document.createElement("ion-card");
          card.innerHTML =
            '<ion-card-header>' +
            '<ion-card-title>' + escapeHtml(r.item) + '</ion-card-title>' +
            '</ion-card-header>' +
            '<ion-card-content>' +
            '<div class="record-amount">' + formatHKD(r.amount) + '</div>' +
            '<div class="record-meta"><span>' + escapeHtml(r.date) + '</span></div>' +
            '</ion-card-content>';
          listEl.appendChild(card);
        });
      }

      function escapeHtml(text) {
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function confirmClearAll() {
        var records = getRecords();
        if (records.length === 0) {
          presentToast("沒有可清除的紀錄");
          return;
        }
        presentAlert("清除全部紀錄", "確定要刪除所有 " + records.length + " 筆支出紀錄嗎？此操作無法復原。", [
          { text: "取消", role: "cancel" },
          {
            text: "清除",
            role: "destructive",
            handler: function () {
              setRecords([]);
              renderRecords();
              presentToast("已清除全部紀錄", 1800, "bottom", "warning");
            }
          }
        ]);
      }

      window.addEventListener("load", function () {
        setTimeout(function () {
          updateHomeStats();
        }, 200);
      });
    </script>

  </body>
</html>
